<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>WigWars Map</title>

  <link
    rel="stylesheet"
    href="https://maps.secondlife.com/_styles/sl.mapapi2.css"
  >

  <script src="https://maps.secondlife.com/_scripts/sl.mapapi2.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #map {
      width: 100vw;
      height: 100vh;
      min-height: 600px;
      background: #182229;
    }

    #status {
      position: fixed;
      left: 10px;
      bottom: 10px;
      z-index: 9999;
      padding: 7px 10px;
      color: white;
      background: rgba(0, 0, 0, 0.75);
      font: 13px Arial, sans-serif;
      border-radius: 3px;
    }
  </style>
</head>

<body>
  <div id="map"></div>
  <div id="status">Loading map...</div>

  <script>
    const baseUrl =
      "https://simhost-02219c8660a9ab0b1.agni.secondlife.io:12043/cap/d0434de3-5206-3502-b120-b63a90e91ef3/";

    const statusElement = document.getElementById("status");
    const mapElement = document.getElementById("map");

    function setStatus(message) {
      statusElement.textContent = message;
      console.log(message);
    }

    async function loadText(path) {
      const response = await fetch(baseUrl + path);

      if (!response.ok) {
        throw new Error(
          `${path}: ${response.status} ${response.statusText}`
        );
      }

      return response.text();
    }

    async function loadJson(path) {
      const response = await fetch(baseUrl + path);

      if (!response.ok) {
        throw new Error(
          `${path}: ${response.status} ${response.statusText}`
        );
      }

      return response.json();
    }

    async function start() {
      try {
        setStatus(
          `Map area: ${mapElement.offsetWidth} × ${mapElement.offsetHeight}`
        );

        if (typeof SLMap !== "function") {
          throw new Error("SLMap API was not loaded.");
        }

        const map = SLMap(mapElement);
        map.setView([1062, 1124], 3);

        setStatus("Base map loaded. Loading WigWars data...");

        try {
          const customCss = await loadText("css");

          if (customCss.trim().startsWith("<")) {
            document.head.insertAdjacentHTML("beforeend", customCss);
          } else {
            const style = document.createElement("style");
            style.textContent = customCss;
            document.head.appendChild(style);
          }
        } catch (error) {
          console.warn("Custom CSS could not be loaded:", error);
        }

        const data = await loadJson("col");
        const icon = L.icon(data.ic);

        data.col.forEach(colony => {
          const position = [
            colony.y + 0.5,
            colony.x + 0.5
          ];

          L.marker(position, {
            icon: icon
          })
            .addTo(map)
            .bindPopup(
              `<h4>${colony.name}</h4>` +
              `<p>Product: ${colony.prod}</p>`
            );
        });

        map.invalidateSize();

        setStatus(`${data.col.length} colonies loaded.`);

        setTimeout(() => {
          statusElement.style.display = "none";
        }, 3000);
      } catch (error) {
        console.error(error);
        setStatus(`ERROR: ${error.message}`);
      }
    }

    window.addEventListener("load", start);
  </script>
</body>
</html>
